<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAiSON</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#fff;
}

.container{
  max-width:800px;
  margin:0 auto;
  padding:24px;
}

h1{
  font-family:'Orbitron',sans-serif;
  font-size:48px;
  color:#5aa2ff;
}

.landing-text{
  font-size:22px;
  margin-top:10px;
}

.landing-sub{
  font-size:16px;
  color:#444;
}

.notice{
  position:fixed;
  top:18px;
  right:18px;
  width:340px;
  background:#fff;
  border:1px solid #ddd;
  padding:16px;
  border-radius:6px;
  box-shadow:0 6px 20px rgba(0,0,0,0.12);
  cursor:pointer;
}

.notice h3{
  margin:0 0 10px 0;
  font-size:14px;
  letter-spacing:.05em;
}

.notice p{
  margin:0;
  font-size:13px;
  color:#333;
}

.notice a{
  display:inline-block;
  margin-top:10px;
  background:#111;
  color:#fff;
  padding:8px 12px;
  font-size:12px;
  text-decoration:none;
  border-radius:4px;
}
</style>
</head>

<body>

<div class="container">
  <h1>LAiSON.</h1>
  <p class="landing-text">AI systems, evidence handling, and controlled deployment.</p>
  <p class="landing-sub">Tap below to view notice.</p>
</div>

<div class="notice" onclick="window.location.href='urgent-notice.html';">
  <h3>PUBLIC NOTICE</h3>
  <p>
    A device is being preserved for potential law enforcement review.
  </p>
  <a href="urgent-notice.html">VIEW NOTICE</a>
</div>

</body>
</html>
