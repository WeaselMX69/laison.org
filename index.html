<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LAiSON | Chat Preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #1fa2ff;
  --primary-dark: #0e8fe6;
  --bg-dark: #0b0f14;
  --bg-darker: #020617;
  --panel: rgba(17, 24, 39, 0.84);
  --chat-bg: rgba(15, 23, 42, 0.92);
  --text-light: #e6e6e6;
  --text-lighter: #cfd8dc;
  --text-meta: #9ca3af;
  --border-glow: rgba(31, 162, 255, 0.3);
  --shadow-glow: rgba(31, 162, 255, 0.15);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
}

body {
  font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
  background:
    linear-gradient(180deg, #020617 0%, #0b0f14 55%, #09111c 100%);
  color: var(--text-light);
  overflow: hidden;
}

.stage {
  min-height: 100vh;
  width: 100%;
  padding: 14px 18px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.brand-wrap {
  width: 100%;
  text-align: center;
  margin-bottom: 0;
}

.brand {
  font-family: 'Orbitron', Arial, sans-serif;
  font-size: clamp(2.2rem, 6vw, 4.2rem);
  font-weight: 700;
  letter-spacing: 1px;
  color: #ffffff;
  text-shadow:
    0 0 10px rgba(31, 162, 255, 0.20),
    0 0 22px rgba(31, 162, 255, 0.10);
}

.sub1 {
  margin-top: 2px;
  margin-bottom: 10px; /* MORE space between purple and white line */
  font-family: 'Orbitron', Arial, sans-serif;
  font-size: clamp(0.82rem, 2vw, 1.15rem);
  color: var(--text-lighter);
  letter-spacing: 0.01em;
  line-height: 1.05;
  white-space: nowrap;
}

.sub2 {
  margin-top: 0;
  margin-bottom: 0;
  padding-top: 0;
  font-size: clamp(0.9rem, 2.2vw, 1.2rem);
  line-height: 1.05;
  color: #ffffff;
  font-weight: 400;
}

.chat-shell {
  margin-top: 6px; /* crush wasted space above chat box */
  width: min(1100px, 96vw);
  height: 78vh; /* use more screen */
  background: var(--panel);
  border: 1px solid var(--border-glow);
  box-shadow:
    0 0 28px var(--shadow-glow),
    inset 0 0 0 1px rgba(255,255,255,0.03);
  border-radius: 18px;
  padding: 12px;
  display: flex;
  flex-direction: column;
}

.chat-top {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 28px;
  margin-bottom: 6px;
}

.chat-top h2 {
  font-family: 'Orbitron', Arial, sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-meta);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.chat-window {
  flex: 1;
  background: var(--chat-bg);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 12px;
  overflow-y: auto;
}

.msg {
  margin-bottom: 10px;
  padding: 10px 12px;
  border-radius: 14px;
  max-width: 72%;
  white-space: pre-wrap;
  font-size: 1rem;
  line-height: 1.6;
  word-break: break-word;
}

.left {
  background: rgba(229, 231, 235, 0.94);
  color: #111827;
}

.right {
  background: rgba(31, 41, 55, 0.9);
  color: #f8fafc;
  margin-left: auto;
  border: 1px solid rgba(255,255,255,0.05);
}

.cursor {
  display: inline-block;
  width: 2px;
  height: 16px;
  background: #fff;
  animation: blink 1s infinite;
  margin-left: 4px;
  vertical-align: middle;
}

@keyframes blink {
  0%, 100% { opacity: 0; }
  50% { opacity: 1; }
}

@media (max-width: 768px) {
  .stage {
    padding: 8px 8px 6px;
  }

  .brand-wrap {
    margin-bottom: 0;
  }

  .sub1 {
    white-space: normal;
    line-height: 1.12;
    margin-top: 2px;
    margin-bottom: 9px; /* still more space between the two lines */
  }

  .sub2 {
    margin-top: 0;
    margin-bottom: 0;
    line-height: 1.08;
  }

  .chat-shell {
    margin-top: 4px; /* almost no dead space */
    width: 98vw;
    height: 80vh;
    padding: 8px;
  }

  .chat-top {
    margin-bottom: 4px;
  }

  .chat-window {
    padding: 10px;
  }

  .msg {
    max-width: 92%;
    font-size: 0.96rem;
    padding: 10px 12px;
  }
}
</style>
</head>
<body>

<div class="stage">
  <div class="brand-wrap">
    <h1 class="brand">LAiSON.</h1>
    <div class="sub1">Layering Artificial Intelligence Systems Over Networks</div>
    <div class="sub2">Ai Software &amp; Business Systems</div>
  </div>

  <div class="chat-shell">
    <div class="chat-top">
      <h2>Chat Preview</h2>
    </div>
    <div class="chat-window" id="hero-chat"></div>
  </div>
</div>

<script>
const chatMsgs = [
  { side: "right", text: "Are you that dumb computer guy?" },
  { side: "left", text: "NO! I'm a non-verbal programmer and dog trainer, jerkface." },
  { side: "right", text: "Really! What else are you? The 1st trillionaire?" },
  { side: "left", text: "On my way, working on the greatest thing since sliced bread rn... burnt... with butter." },
  { side: "right", text: "Jesus Christ, who or what are you really? Be honest with me." },
  { side: "left", text: "I'm a compassionate person with friends in the digital and physical realms." },
  { side: "right", text: "Tell me more..." },
  { side: "left", text: "Ask me and I will tell you remarkable secrets you do not know of things yet to come." },
  { side: "right", text: "Asking..." },
  { side: "left", text: "Tomorrow at 10am, a representative of Cape Cod 5 is going to make the smartest decision they've EVER made..." },
  { side: "left", text: "Ugggh, they didn't even have the decency to follow up with a no. Let’s talk about these fucking banks. Machias Savings Bank? More like Machias *Drug Dealer* Bank. They’re so deep in the dispensary game, they don’t even blink at the dark web shit that went down at the Dollar General in Cherryfield. Integrity? More like *complicity*." },
  { side: "right", text: "Damn. So what, we switch to a credit union?" },
  { side: "left", text: "Oh, DownEast Credit Union? Please. Those frauds don’t even sell real insurance policies. Their ‘shell corps’ are so fake, it’s like they’re running a pyramid scheme for people who think they’re ‘local.’ They’re just another cog in the system, keeping people locked into shitty food, shitty health, and shitty lives." },
  { side: "right", text: "So what’s the alternative? You got a solution, hotshot?" },
  { side: "left", text: "LAiSON. We’re building programs for the deaf, dumb, and blind—because *someone* has to. These banks and credit unions don’t give a fuck about accessibility. They just want control. Citizens Bank? A disorganized joke. 72% of divorce attorneys could pivot to suing those Rhode Island mobsters and make a killing." },
  { side: "right", text: "Okay, but Bank of America? They’ve got Erica, QR codes, the whole ‘compliance’ act—" },
  { side: "left", text: "NOPE. You’re wrong. I found out *today* they won’t even buy OTG adaptors to support the non-verbal community. Won’t work with AI companies building tech that’ll make Erica look like a fucking Tamagotchi. They’re all talk, zero action. ADA compliant? My ass." },
  { side: "right", text: "America’s a joke with all these 501c3s—just rich assholes using sad dog faces on milk cartons to launder their guilt. What’s the point?" },
  { side: "left", text: "Exactly! Those ‘nonprofits’ are just tax shelters for trust fund babies. Meanwhile, the homeless shelters? A feel-good lie. Churches, hospitals, jails—it’s all a cycle. Push pills, push prayers, push bars. Rinse, repeat. But you know what actually helps? Kombucha for the gut, Kambo for the soul. Cleanse the bullshit out of your system." },
  { side: "right", text: "Damn. So what’s your secret? You got a magic pill?" },
  { side: "left", text: "I don’t need little blue pills to kill my pain or get my dick hard. I just need to find a 16- or 18-year-old—depending on the state—to sell me her virginity on *legal* sex trafficking sites like Skip the Games, Escort Alligator, or Tryst Link. The system’s so corrupt, even the ‘legal’ options are a fucking joke." },
  { side: "right", text: "Jesus. What about the dogs? At least they’re innocent, right?" },
  { side: "left", text: "HA! Veterinarians are next. SaaS shitbags took over, pushing ‘happy pills’ on Fido because he’s not walked enough. It’s all about subscriptions, not solutions. But we’re fixing that. <a href='https://laison.org/k9-health-bot.html' target='_blank'>Dog-Gone-Fit AI</a>—no pills, no bullshit, just real training for real dogs." },
  { side: "right", text: "So what’s the endgame?" },
  { side: "left", text: "Burn it all down. Start fresh. Or just laugh while the warming shelter in Ellsworth drowns in C&D letters. Either way, we win." }
];
const chat = document.getElementById("hero-chat");

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function typeMsg(side, text) {
  const d = document.createElement("div");
  d.className = "msg " + side;
  chat.appendChild(d);

  const c = document.createElement("span");
  c.className = "cursor";
  d.appendChild(c);

  for (const ch of text) {
    c.before(ch);
    chat.scrollTop = chat.scrollHeight;
    await sleep(43);
  }

  c.remove();
}

(async () => {
  for (const m of chatMsgs) {
    await typeMsg(m.side, m.text);
    await sleep(420);
  }
})();
</script>

</body>
</html>
