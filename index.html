<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LAiSON | Chat Preview</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #1fa2ff;
  --primary-dark: #0e8fe6;
  --bg-dark: #0b0f14;
  --bg-darker: #020617;
  --panel: rgba(17, 24, 39, 0.84);
  --chat-bg: rgba(15, 23, 42, 0.92);
  --text-light: #e6e6e6;
  --text-lighter: #cfd8dc;
  --text-meta: #9ca3af;
  --border-glow: rgba(31, 162, 255, 0.3);
  --shadow-glow: rgba(31, 162, 255, 0.15);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
}

body {
  font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
  background:
    linear-gradient(180deg, #020617 0%, #0b0f14 55%, #09111c 100%);
  color: var(--text-light);
  overflow: hidden;
}

.stage {
  min-height: 100vh;
  width: 100%;
  padding: 14px 18px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.brand-wrap {
  width: 100%;
  text-align: center;
  margin-bottom: 0;
}

.brand {
  font-family: 'Orbitron', Arial, sans-serif;
  font-size: clamp(2.2rem, 6vw, 4.2rem);
  font-weight: 700;
  letter-spacing: 1px;
  color: #ffffff;
  text-shadow:
    0 0 10px rgba(31, 162, 255, 0.20),
    0 0 22px rgba(31, 162, 255, 0.10);
}

.sub1 {
  margin-top: 2px;
  margin-bottom: 10px; /* MORE space between purple and white line */
  font-family: 'Orbitron', Arial, sans-serif;
  font-size: clamp(0.82rem, 2vw, 1.15rem);
  color: var(--text-lighter);
  letter-spacing: 0.01em;
  line-height: 1.05;
  white-space: nowrap;
}

.sub2 {
  margin-top: 0;
  margin-bottom: 0;
  padding-top: 0;
  font-size: clamp(0.9rem, 2.2vw, 1.2rem);
  line-height: 1.05;
  color: #ffffff;
  font-weight: 400;
}

.chat-shell {
  margin-top: 6px; /* crush wasted space above chat box */
  width: min(1100px, 96vw);
  height: 78vh; /* use more screen */
  background: var(--panel);
  border: 1px solid var(--border-glow);
  box-shadow:
    0 0 28px var(--shadow-glow),
    inset 0 0 0 1px rgba(255,255,255,0.03);
  border-radius: 18px;
  padding: 12px;
  display: flex;
  flex-direction: column;
}

.chat-top {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 28px;
  margin-bottom: 6px;
}

.chat-top h2 {
  font-family: 'Orbitron', Arial, sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-meta);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.chat-window {
  flex: 1;
  background: var(--chat-bg);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 12px;
  overflow-y: auto;
}

.msg {
  margin-bottom: 10px;
  padding: 10px 12px;
  border-radius: 14px;
  max-width: 72%;
  white-space: pre-wrap;
  font-size: 1rem;
  line-height: 1.6;
  word-break: break-word;
}

.left {
  background: rgba(229, 231, 235, 0.94);
  color: #111827;
}

.right {
  background: rgba(31, 41, 55, 0.9);
  color: #f8fafc;
  margin-left: auto;
  border: 1px solid rgba(255,255,255,0.05);
}

.cursor {
  display: inline-block;
  width: 2px;
  height: 16px;
  background: #fff;
  animation: blink 1s infinite;
  margin-left: 4px;
  vertical-align: middle;
}

@keyframes blink {
  0%, 100% { opacity: 0; }
  50% { opacity: 1; }
}

@media (max-width: 768px) {
  .stage {
    padding: 8px 8px 6px;
  }

  .brand-wrap {
    margin-bottom: 0;
  }

  .sub1 {
    white-space: normal;
    line-height: 1.12;
    margin-top: 2px;
    margin-bottom: 9px; /* still more space between the two lines */
  }

  .sub2 {
    margin-top: 0;
    margin-bottom: 0;
    line-height: 1.08;
  }

  .chat-shell {
    margin-top: 4px; /* almost no dead space */
    width: 98vw;
    height: 80vh;
    padding: 8px;
  }

  .chat-top {
    margin-bottom: 4px;
  }

  .chat-window {
    padding: 10px;
  }

  .msg {
    max-width: 92%;
    font-size: 0.96rem;
    padding: 10px 12px;
  }
}
</style>
</head>
<body>

<div class="stage">
  <div class="brand-wrap">
    <h1 class="brand">LAiSON.</h1>
    <div class="sub1">Layering Artificial Intelligence Systems Over Networks</div>
    <div class="sub2">Ai Software &amp; Business Systems</div>
  </div>

  <div class="chat-shell">
    <div class="chat-top">
      <h2>Chat Preview</h2>
    </div>
    <div class="chat-window" id="hero-chat"></div>
  </div>
</div>

<script>
const chatMsgs = [
  { side: "right", text: "So what’s the move?" },
  { side: "left", text: "Reduce risk without slowing operations. Focused system, clear outcome, no unnecessary layers." },
  { side: "right", text: "Every vendor we bring in adds complexity. More integrations, more exposure." },
  { side: "left", text: "Exactly. Vendor sprawl is the problem. Each one expands your attack surface, increases audit scope, and creates dependency you can’t easily unwind." },
  { side: "right", text: "But replacing systems isn’t realistic. Core infrastructure is locked in." },
  { side: "left", text: "You don’t replace it—you layer over it. Especially in environments built on Fiserv or similar cores—controlled interfaces, minimal permissions, full visibility. No disruption, just control." },
  { side: "right", text: "So you’re reducing third-party risk without a full migration?" },
  { side: "left", text: "Exactly. Fewer external dependencies, tighter control, cleaner audit trails. Aligns with NIST and FFIEC expectations without creating new exposure." },
  { side: "right", text: "Where do you even start with something like that?" },
  { side: "left", text: "Targeted deployments. One high-impact problem at a time. Dog-Gone-Fit AI shows the model—focused system, measurable outcome, no vendor lock-in. It was built by LAiSON outside the traditional SaaS model—because that model is reaching its limits. Organizations are over-integrated, overexposed, and under-controlled. Building correctly from the start costs more upfront, but the long-term savings and control are exponential." },
  { side: "right", text: "How so?" },
  { side: "left", text: "Progressive reduction of unnecessary vendors. Stronger internal control. Systems that pass audits because they’re simple, not because they’re buried in documentation." }
];
const chat = document.getElementById("hero-chat");

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function typeMsg(side, text) {
  const d = document.createElement("div");
  d.className = "msg " + side;
  chat.appendChild(d);

  const c = document.createElement("span");
  c.className = "cursor";
  d.appendChild(c);

  for (const ch of text) {
    c.before(ch);
    chat.scrollTop = chat.scrollHeight;
    await sleep(43);
  }

  c.remove();
}

(async () => {
  for (const m of chatMsgs) {
    await typeMsg(m.side, m.text);
    await sleep(420);
  }
  // Wait 5 seconds after the last message
  await sleep(5000);
  document.getElementById('healthBotOverlay').style.display = 'flex';
})();
</script>
<div id="healthBotOverlay" style="
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.9);
  z-index: 9999;
  justify-content: center;
  align-items: center;
  flex-direction: column;
">
  <div style="
    background: #0b0f14;
    padding: 20px;
    border-radius: 10px;
    border: 1px solid #1fa2ff;
    max-width: 500px;
    text-align: center;
  ">
    <h2 style="color: #1fa2ff; margin-bottom: 10px;">Dog-Gone-Fit AI</h2>
    <p style="color: #e6e6e6; margin-bottom: 15px;">
      The future of non-verbal dog training is here. No banks, no bullshit.
    </p>
    <a
      href="https://laison.org/k9-health-bot.html"
      target="_blank"
      style="
        display: inline-block;
        padding: 10px 20px;
        background: #1fa2ff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
      "
      onclick="document.getElementById('healthBotOverlay').style.display = 'none';"
    >
      Open Dog-Gone-Fit AI
    </a>
    <button
      onclick="document.getElementById('healthBotOverlay').style.display = 'none';"
      style="
        margin-top: 10px;
        background: transparent;
        border: 1px solid #1fa2ff;
        color: #1fa2ff;
        padding: 8px 15px;
        border-radius: 5px;
        cursor: pointer;
      "
    >
      Close
    </button>
  </div>
</div>
</body>
</html>
