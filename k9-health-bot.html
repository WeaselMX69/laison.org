<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat with Dog-Gone-Fit Ai</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #1fa2ff;
  --primary-dark: #0e8fe6;
  --bg-dark: #0b0f14;
  --bg-darker: #020617;
  --text-light: #e6e6e6;
  --text-lighter: #cfd8dc;
  --text-meta: #9ca3af;
  --border-glow: rgba(31, 162, 255, 0.3);
  --shadow-glow: rgba(31, 162, 255, 0.15);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background:
    linear-gradient(rgba(5,10,20,0.92), rgba(5,10,20,0.96)),
    url('https://images.unsplash.com/photo-1558944351-cb1e7e6e9f85?auto=format&fit=crop&w=1600&q=70') center/cover fixed;
  color: var(--text-light);
}
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.panel {
  width: 100%;
  max-width: 1000px;
  background: rgba(17,24,39,0.88);
  border: 1px solid var(--border-glow);
  border-radius: 18px;
  box-shadow: 0 0 28px var(--shadow-glow);
  padding: 30px 20px;
  backdrop-filter: blur(8px);
}
.brand {
  font-family: 'Orbitron', sans-serif;
  font-size: 2rem;
  text-align: center;
  margin-bottom: 8px;
}
.sub {
  text-align: center;
  color: var(--text-lighter);
  margin-bottom: 20px;
}
#chat {
  max-height: 60vh;
  overflow-y: auto;
  padding: 10px;
}
.msg {
  margin-bottom: 14px;
  padding: 14px 16px;
  border-radius: 12px;
  max-width: 75%;
  line-height: 1.5;
  white-space: pre-wrap;
}
.user {
  background: rgba(31,41,55,0.9);
  margin-left: auto;
}
.bot {
  background: rgba(229,231,235,0.92);
  color: #111;
}
form {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}
input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--border-glow);
  background: rgba(17,24,39,0.8);
  color: #fff;
}
button {
  padding: 12px 18px;
  border-radius: 10px;
  border: none;
  background: var(--primary);
  color: #fff;
  cursor: pointer;
  font-weight: 600;
}
button:hover {
  background: var(--primary-dark);
}
.status {
  font-size: 12px;
  color: var(--text-meta);
  margin-top: 10px;
  text-align: center;
}
.cta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
}
.cta-link {
  display: inline-block;
  padding: 10px 14px;
  background: #1fa2ff;
  color: #fff;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 600;
}
.cta-link.secondary {
  background: rgba(17,24,39,0.95);
  border: 1px solid rgba(31,162,255,0.35);
}
</style>
</head>

<body>

<section class="hero">
  <div class="panel">
    <div class="brand">Chat with Dog-Gone-Fit Ai</div>
    <div class="sub">
      Adventure hikes • indoor agility • photo updates • smart intake
    </div>

    <div id="chat"></div>

    <form id="form">
      <input id="input" placeholder="Ask about hikes, pricing, or getting started…" autocomplete="off">
      <button type="submit">Send</button>
    </form>

    <div class="status">Dog-Gone-Fit AI assistant • secure access required for full use</div>
  </div>
</section>

<script>
const API = "https://dgf-api.laison.org/ingest";
const REGISTER_URL = "https://dgf-api.laison.org/#register";
const LOGIN_URL = "https://dgf-api.laison.org/#login";

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");

function add(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

add("Hi — I can help with hikes, agility, pricing, and getting started.", "bot");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const text = input.value.trim();
  if (!text) return;

  add(text, "user");
  input.value = "";

  const thinking = document.createElement("div");
  thinking.className = "msg bot";
  thinking.textContent = "Thinking…";
  chat.appendChild(thinking);

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text,
        channel: "website",
        task: "reply"
      })
    });

    const data = await res.json();

    if (data.requires_auth) {
      thinking.innerHTML = `
        <div style="margin-bottom:10px;">
          🔒 This system requires a verified secure account.
        </div>

        <div style="font-size:14px; opacity:0.9; margin-bottom:14px;">
          • 37-character password requirement<br>
          • Human verification<br>
          • Secure authenticated access
        </div>

        <div class="cta-row">
          <a class="cta-link" href="${REGISTER_URL}">Create Secure Account →</a>
          <a class="cta-link secondary" href="${LOGIN_URL}">Login</a>
        </div>

        <div style="font-size:11px; opacity:0.65; margin-top:10px;">
          Built for real-world security, not public abuse.
        </div>
      `;
    } else {
      thinking.textContent = data.response || data.detail || "No response.";
    }
  } catch {
    thinking.textContent = "Connection issue. Try again.";
  }

  thinking.scrollIntoView({ behavior: "smooth", block: "start" });
});
</script>

</body>
</html>
