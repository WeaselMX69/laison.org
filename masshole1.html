<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motion Form</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:white}
.toolbar{position:sticky;top:0;z-index:999;background:#111;padding:8px;text-align:center}
.toolbar button{font:bold 14px Arial;padding:8px 12px;margin:3px}
.page{
  position:relative;
  width:8.5in;
  height:11in;
  margin:0 auto;
  page-break-after:always;
  background-size:100% 100%;
  background-repeat:no-repeat;
  background-position:center;
}
.page:last-child{page-break-after:auto}
#p1{background-image:url("page1.jpg")}
#p2{background-image:url("page2.jpg")}
.field{
  position:absolute;
  background:transparent;
  border:0;
  outline:0;
  font:18px Arial;
  color:#000;
}
textarea.field{
  resize:none;
  overflow:hidden;
  line-height:1.25;
}
.check{
  position:absolute;
  width:14px;
  height:14px;
}
@page{size:letter;margin:0}
@media print{
  .toolbar{display:none}
  .page{margin:0;width:8.5in;height:11in}
}
</style>
</head>
<body>

<div class="toolbar">
<button onclick="window.print()">Print / Save PDF</button>
<button onclick="addPage()">Add Page Two</button>
</div>

<div id="forms">
<section class="page" id="p1">
  <input class="field" style="left:3.55in;top:.68in;width:2.1in;height:.32in" value="2625CV000190">
  <input class="field" style="left:.72in;top:1.17in;width:2.15in;height:.35in" value="Lisa J. McAdams">
  <input class="field" style="left:3.05in;top:1.17in;width:2.05in;height:.35in" value="John Stockton">
  <input class="field" style="left:6.72in;top:1.17in;width:1.45in;height:.35in" value="Barnstable">

  <input type="checkbox" class="check" style="left:.85in;top:5.87in" checked>

  <input class="field" style="left:.98in;top:6.38in;width:1.18in;height:.22in">
  <input class="field" style="left:.43in;top:7.13in;width:1.55in;height:.22in">
  <input class="field" style="left:2.06in;top:7.13in;width:2.55in;height:.22in">
  <input class="field" style="left:4.85in;top:7.13in;width:2.38in;height:.22in">
  <input class="field" style="left:7.27in;top:7.13in;width:.82in;height:.22in">
  <input class="field" style="left:.43in;top:7.63in;width:3.12in;height:.22in">
  <input class="field" style="left:3.62in;top:7.63in;width:4.48in;height:.22in">
</section>

<section class="page" id="p2">
  <input class="field" style="left:2.75in;top:.50in;width:1.9in;height:.30in" value="2625CV000190">
  <textarea class="field" style="left:.60in;top:1.05in;width:7.35in;height:9.2in"></textarea>
</section>
</div>

<script>
function addPage(){
  const src=document.getElementById('p2');
  const clone=src.cloneNode(true);
  clone.querySelectorAll('textarea').forEach(t=>t.value='');
  document.getElementById('forms').appendChild(clone);
  clone.scrollIntoView({behavior:'smooth'});
}
</script>

</body>
</html>
